# Tooling config only — no packaging, this is a flat 72-hour project.
# OWNER: B (it backs `make check`). Anyone may add a per-file ignore for their files.

[tool.ruff]
line-length = 100
# 3.10, not 3.11: `orchestrator/__init__.py` guards for 3.10 and A did real work to keep
# the runtime importable there. With py311 set, ruff's UP017 demanded `datetime.UTC` —
# which is 3.11+ — so obeying the linter would have broken the portability it was meant
# to protect. Raise this only when the 3.10 floor is actually dropped.
target-version = "py310"
exclude = ["tests/fixtures/pipelines", "reference", "runs", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # function call in default argument — deliberate in dataclass factories
    "SIM105",  # contextlib.suppress is not clearer than try/except/pass here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:randomly"
filterwarnings = ["ignore::DeprecationWarning"]
