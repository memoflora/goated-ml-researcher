# OWNER: B. Keeping main green is B's to enforce.
name: check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-pipeline.txt ]; then pip install -r requirements-pipeline.txt; fi

      - name: Lint
        run: ruff check orchestrator tests

      - name: Tests (unit + fault injection)
        run: pytest -q

      # Stubbed: no ANTHROPIC_API_KEY in CI, by design. A run that needs a secret
      # to prove it works is a run we cannot verify on every push.
      - name: Smoke run
        env:
          TECHJAM_LLM: stub
        run: make smoke

      - name: No leaked pipeline processes
        if: always()
        run: |
          if pgrep -f "pipeline.py --data-dir" > /dev/null; then
            echo "::error::a pipeline process outlived the test run"; exit 1
          fi
